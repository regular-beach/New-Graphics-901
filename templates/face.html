{%extends "base.html"%}
{% block head %}
{{ super() }}
<link href="{{ url_for('static', filename='styles/work.css') }}" rel="stylesheet" />

{% endblock %}



{% block main %}
<div id="typingContainer">
  <div id="typingTextTop" class="intro"></div>
  <div id="typingTextMiddle" class="intro"></div>
  <div id="typingTextBottom" class="intro"></div>
 </div>


<!--LIST-->
<div class="main" id="mainContent">
<div class="project-layout">
  <div class="project-preview">
    <img id="preview-img" src="" alt="Preview">
  </div>

  <div class="project-list">
    {% include 'header.html' %}
    <div class="view"><a href="{{ url_for('work') }}">grid</a> 
      
    </div>

    {% for project in projects %}
      <a href="/projects/{{ project.slug }}" class="project-row" data-image="{{ project.image }}">
        <img class="mobile-preview" src="{{ project.image }}" alt="{{ project.title }}">
        <div class="project-title">{{ project.title }}</div>
        <div class="project-meta">
          <span class="project-type">{{ project.type }}</span>
          <span class="project-year">{{ project.year }}</span>
        </div>
      </a>
    {% endfor %}
  </div>
</div>
</div>
{% endblock %}


{% block scripts %}
<script>
  //primo animation
  document.addEventListener("DOMContentLoaded", function() {
const text = "New-Graphics-2000";
const typingSpeed = 50;
const delays = [300, 0, 600];

const typingTextTop = document.getElementById("typingTextTop");
const typingTextMiddle = document.getElementById("typingTextMiddle");
const typingTextBottom = document.getElementById("typingTextBottom");
const typingContainer = document.getElementById("typingContainer");
const mainContent = document.getElementById("mainContent");

function typeText(element, delay) {
   let index = 0;
   setTimeout(() => {
       function type() {
           if (index < text.length) {
               element.textContent += text.charAt(index);
               index++;
               setTimeout(type, typingSpeed);
           } else {
               if (element === typingTextBottom) {
                   setTimeout(fadeOutTexts, 1000);
               }
           }
       }
       type();
   }, delay);
}

function fadeOutTexts() {
   typingContainer.style.opacity = "0";
   setTimeout(() => {
       typingContainer.style.display = "none";
       sessionStorage.setItem("visited", "true"); // Mark the session as played
       showMain();
   }, 500);
}

function showMain() {
   setTimeout(() => {
       if (mainContent) {
           mainContent.classList.add("main-visible");
       }
   }, 500);
}

window.addEventListener("load", function() {
   if (!sessionStorage.getItem("visited")) {
       // First-ever visit: Show intro animation
       typingContainer.style.display = "flex"; // Make sure it's visible
       typeText(typingTextTop, delays[0]);
       typeText(typingTextMiddle, delays[1]);
       typeText(typingTextBottom, delays[2]);
   } else {
       // Already visited: Hide intro text & show main content immediately
       typingContainer.style.display = "none";
       showMain();
   }
});
});

//list

document.addEventListener("DOMContentLoaded", () => {
  const rows = document.querySelectorAll('.project-row');
  const previewImg = document.getElementById('preview-img');

  if (!rows.length) return;

  // Show first project preview by default
  const firstImgSrc = rows[0].getAttribute('data-image');
  if (firstImgSrc) {
    previewImg.src = firstImgSrc;
    previewImg.style.display = 'block';
  }

  rows.forEach(row => {
    row.addEventListener('mouseenter', () => {
      const imgSrc = row.getAttribute('data-image');
      if (imgSrc && previewImg.src !== imgSrc) {
        previewImg.src = imgSrc;
        previewImg.style.display = 'block';
      }
    });
  });
});


</script>
{% include 'footer.html' %}
{% endblock %}
